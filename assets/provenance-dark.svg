<rect width="900" height="592" rx="8" fill="#0d1117"/><rect x="0" y="0" width="900" height="127" fill="#161b22"/><text x="22" y="30" class="title">Every lesson, and the system it came out of</text><text x="22" y="51" class="sub">17 written pieces, traced back to the code that produced them. Left is the system, right is what it taught, and the edges are</text><text x="22" y="66" class="sub">the claim.</text><text x="22" y="90" class="statk">DOORI</text><text x="22" y="111" class="statv">10</text><text x="193.2" y="90" class="statk">DICE</text><text x="193.2" y="111" class="statv">4</text><text x="364.4" y="90" class="statk">AGENTHARNESS</text><text x="364.4" y="111" class="statv">1</text><text x="535.5999999999999" y="90" class="statk">THE LOOPDOWN</text><text x="535.5999999999999" y="111" class="statv">1</text><text x="706.8" y="90" class="statk">PAYMENTSLAB-KMP</text><text x="706.8" y="111" class="statv">1</text><line x1="0" y1="127" x2="900" y2="127" stroke="#30363d"/><path d="M204 156 C258 156 246 155 289 155" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 176 289 176" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 197 289 197" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 218 289 218" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 239 289 239" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 260 289 260" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 281 289 281" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 302 289 302" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 323 289 323" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 344 289 344" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 380 C258 380 246 379 289 379" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 380 C258 380 246 400 289 400" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 380 C258 380 246 421 289 421" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 380 C258 380 246 442 289 442" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 478 C258 478 246 477 289 477" fill="none" stroke="#d29922" stroke-opacity=".42" stroke-width="1"/><path d="M204 513 C258 513 246 512 289 512" fill="none" stroke="#58a6ff" stroke-opacity=".42" stroke-width="1"/><path d="M204 548 C258 548 246 547 289 547" fill="none" stroke="#f778ba" stroke-opacity=".42" stroke-width="1"/><rect x="26" y="149" width="178" height="15" rx="3" fill="#a371f7" fill-opacity=".15"/><text x="35" y="160" class="meta" fill="#a371f7" font-weight="700">Doori</text><text x="195" y="160" class="meta end" fill="#a371f7" font-weight="700">10</text><text x="35" y="175" class="foot"></text><rect x="26" y="373" width="178" height="15" rx="3" fill="#3fb950" fill-opacity=".15"/><text x="35" y="384" class="meta" fill="#3fb950" font-weight="700">Dice</text><text x="195" y="384" class="meta end" fill="#3fb950" font-weight="700">4</text><text x="35" y="399" class="foot">production, private</text><rect x="26" y="471" width="178" height="15" rx="3" fill="#d29922" fill-opacity=".15"/><text x="35" y="482" class="meta" fill="#d29922" font-weight="700">AgentHarness</text><text x="195" y="482" class="meta end" fill="#d29922" font-weight="700">1</text><text x="35" y="497" class="foot">private</text><rect x="26" y="506" width="178" height="15" rx="3" fill="#58a6ff" fill-opacity=".15"/><text x="35" y="517" class="meta" fill="#58a6ff" font-weight="700">The Loopdown</text><text x="195" y="517" class="meta end" fill="#58a6ff" font-weight="700">1</text><text x="35" y="532" class="foot">github.com/darkpandawarrior/t…</text><rect x="26" y="541" width="178" height="15" rx="3" fill="#f778ba" fill-opacity=".15"/><text x="35" y="552" class="meta" fill="#f778ba" font-weight="700">PaymentsLab-KMP</text><text x="195" y="552" class="meta end" fill="#f778ba" font-weight="700">1</text><text x="35" y="567" class="foot"></text><circle cx="295" cy="155" r="2.5" fill="#a371f7"/><text x="308" y="159" class="row">I audited my own migrations. It was not fine.</text><circle cx="295" cy="176" r="2.5" fill="#a371f7"/><text x="308" y="180" class="row">Your thresholds do not belong in constants</text><circle cx="295" cy="197" r="2.5" fill="#a371f7"/><text x="308" y="201" class="row">Invariants are cheap. Silent corruption is not.</text><circle cx="295" cy="218" r="2.5" fill="#a371f7"/><text x="308" y="222" class="row">Every filter needs a documented exception</text><circle cx="295" cy="239" r="2.5" fill="#a371f7"/><text x="308" y="243" class="row">When two sensors disagree, rank them</text><circle cx="295" cy="260" r="2.5" fill="#a371f7"/><text x="308" y="264" class="row">Your data model is where uncertainty goes to die</text><circle cx="295" cy="281" r="2.5" fill="#a371f7"/><text x="308" y="285" class="row">One global threshold is how you delete valid data</text><circle cx="295" cy="302" r="2.5" fill="#a371f7"/><text x="308" y="306" class="row">Filtered should never mean deleted</text><circle cx="295" cy="323" r="2.5" fill="#a371f7"/><text x="308" y="327" class="row">The 5-second window that crashes your service</text><circle cx="295" cy="344" r="2.5" fill="#a371f7"/><text x="308" y="348" class="row">Teaching a phone to disbelieve its own GPS</text><circle cx="295" cy="379" r="2.5" fill="#3fb950"/><text x="308" y="383" class="row">Never silently change a number someone gets paid on</text><circle cx="295" cy="400" r="2.5" fill="#3fb950"/><text x="308" y="404" class="row">collectAsState is quietly leaking your work</text><circle cx="295" cy="421" r="2.5" fill="#3fb950"/><text x="308" y="425" class="row">Your LazyColumn recomposes on every scroll</text><circle cx="295" cy="442" r="2.5" fill="#3fb950"/><text x="308" y="446" class="row">CancellationException is not an assassin</text><circle cx="295" cy="477" r="2.5" fill="#d29922"/><text x="308" y="481" class="row">The captain routes. The captain never rows.</text><circle cx="295" cy="512" r="2.5" fill="#58a6ff"/><text x="308" y="516" class="row">Plausible is worse than wrong</text><circle cx="295" cy="547" r="2.5" fill="#f778ba"/><text x="308" y="551" class="row">expect/actual is the wrong default in KMP</text><text x="22" y="582" class="foot">Generated 2026-09-05 from the-loopdown registry.json, itself derived from the lesson files.</text></svg>