<rect width="900" height="718" rx="8" fill="#0d1117"/><rect x="0" y="0" width="900" height="127" fill="#161b22"/><text x="22" y="30" class="title">Every lesson, and the system it came out of</text><text x="22" y="51" class="sub">23 written pieces, traced back to the code that produced them. Left is the system, right is what it taught, and the edges are</text><text x="22" y="66" class="sub">the claim.</text><text x="22" y="90" class="statk">DOORI</text><text x="22" y="111" class="statv">13</text><text x="193.2" y="90" class="statk">PAYMENTSLAB-KMP</text><text x="193.2" y="111" class="statv">4</text><text x="364.4" y="90" class="statk">DICE</text><text x="364.4" y="111" class="statv">4</text><text x="535.5999999999999" y="90" class="statk">AGENTHARNESS</text><text x="535.5999999999999" y="111" class="statv">1</text><text x="706.8" y="90" class="statk">THE LOOPDOWN</text><text x="706.8" y="111" class="statv">1</text><line x1="0" y1="127" x2="900" y2="127" stroke="#30363d"/><path d="M204 156 C258 156 246 155 289 155" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 176 289 176" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 197 289 197" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 218 289 218" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 239 289 239" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 260 289 260" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 281 289 281" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 302 289 302" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 323 289 323" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 344 289 344" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 365 289 365" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 386 289 386" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 156 C258 156 246 407 289 407" fill="none" stroke="#a371f7" stroke-opacity=".42" stroke-width="1"/><path d="M204 443 C258 443 246 442 289 442" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 443 C258 443 246 463 289 463" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 443 C258 443 246 484 289 484" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 443 C258 443 246 505 289 505" fill="none" stroke="#3fb950" stroke-opacity=".42" stroke-width="1"/><path d="M204 541 C258 541 246 540 289 540" fill="none" stroke="#d29922" stroke-opacity=".42" stroke-width="1"/><path d="M204 541 C258 541 246 561 289 561" fill="none" stroke="#d29922" stroke-opacity=".42" stroke-width="1"/><path d="M204 541 C258 541 246 582 289 582" fill="none" stroke="#d29922" stroke-opacity=".42" stroke-width="1"/><path d="M204 541 C258 541 246 603 289 603" fill="none" stroke="#d29922" stroke-opacity=".42" stroke-width="1"/><path d="M204 639 C258 639 246 638 289 638" fill="none" stroke="#58a6ff" stroke-opacity=".42" stroke-width="1"/><path d="M204 674 C258 674 246 673 289 673" fill="none" stroke="#f778ba" stroke-opacity=".42" stroke-width="1"/><rect x="26" y="149" width="178" height="15" rx="3" fill="#a371f7" fill-opacity=".15"/><text x="35" y="160" class="meta" fill="#a371f7" font-weight="700">Doori</text><text x="195" y="160" class="meta end" fill="#a371f7" font-weight="700">13</text><text x="35" y="175" class="foot">github.com/darkpandawarrior/D…</text><rect x="26" y="436" width="178" height="15" rx="3" fill="#3fb950" fill-opacity=".15"/><text x="35" y="447" class="meta" fill="#3fb950" font-weight="700">PaymentsLab-KMP</text><text x="195" y="447" class="meta end" fill="#3fb950" font-weight="700">4</text><text x="35" y="462" class="foot">github.com/darkpandawarrior/P…</text><rect x="26" y="534" width="178" height="15" rx="3" fill="#d29922" fill-opacity=".15"/><text x="35" y="545" class="meta" fill="#d29922" font-weight="700">Dice</text><text x="195" y="545" class="meta end" fill="#d29922" font-weight="700">4</text><text x="35" y="560" class="foot">production, private</text><rect x="26" y="632" width="178" height="15" rx="3" fill="#58a6ff" fill-opacity=".15"/><text x="35" y="643" class="meta" fill="#58a6ff" font-weight="700">AgentHarness</text><text x="195" y="643" class="meta end" fill="#58a6ff" font-weight="700">1</text><text x="35" y="658" class="foot">private</text><rect x="26" y="667" width="178" height="15" rx="3" fill="#f778ba" fill-opacity=".15"/><text x="35" y="678" class="meta" fill="#f778ba" font-weight="700">The Loopdown</text><text x="195" y="678" class="meta end" fill="#f778ba" font-weight="700">1</text><text x="35" y="693" class="foot">github.com/darkpandawarrior/t…</text><circle cx="295" cy="155" r="2.5" fill="#a371f7"/><text x="308" y="159" class="row">Your LazyColumn is keyed by position until you say otherwise</text><circle cx="295" cy="176" r="2.5" fill="#a371f7"/><text x="308" y="180" class="row">SupervisorJob does not catch anything</text><circle cx="295" cy="197" r="2.5" fill="#a371f7"/><text x="308" y="201" class="row">The wake lock with an expiry date</text><circle cx="295" cy="218" r="2.5" fill="#a371f7"/><text x="308" y="222" class="row">I audited my own migrations. It was not fine.</text><circle cx="295" cy="239" r="2.5" fill="#a371f7"/><text x="308" y="243" class="row">Your thresholds do not belong in constants</text><circle cx="295" cy="260" r="2.5" fill="#a371f7"/><text x="308" y="264" class="row">Invariants are cheap. Silent corruption is not.</text><circle cx="295" cy="281" r="2.5" fill="#a371f7"/><text x="308" y="285" class="row">Every filter needs a documented exception</text><circle cx="295" cy="302" r="2.5" fill="#a371f7"/><text x="308" y="306" class="row">When two sensors disagree, rank them</text><circle cx="295" cy="323" r="2.5" fill="#a371f7"/><text x="308" y="327" class="row">Your data model is where uncertainty goes to die</text><circle cx="295" cy="344" r="2.5" fill="#a371f7"/><text x="308" y="348" class="row">One global threshold is how you delete valid data</text><circle cx="295" cy="365" r="2.5" fill="#a371f7"/><text x="308" y="369" class="row">Filtered should never mean deleted</text><circle cx="295" cy="386" r="2.5" fill="#a371f7"/><text x="308" y="390" class="row">The 5-second window that crashes your service</text><circle cx="295" cy="407" r="2.5" fill="#a371f7"/><text x="308" y="411" class="row">Teaching a phone to disbelieve its own GPS</text><circle cx="295" cy="442" r="2.5" fill="#3fb950"/><text x="308" y="446" class="row">A payments client has no room for probably</text><circle cx="295" cy="463" r="2.5" fill="#3fb950"/><text x="308" y="467" class="row">Gateway number 71 is one line, and nothing checks it</text><circle cx="295" cy="484" r="2.5" fill="#3fb950"/><text x="308" y="488" class="row">My README said 66 gateways. The code said 70.</text><circle cx="295" cy="505" r="2.5" fill="#3fb950"/><text x="308" y="509" class="row">expect/actual is the wrong default in KMP</text><circle cx="295" cy="540" r="2.5" fill="#d29922"/><text x="308" y="544" class="row">Never silently change a number someone gets paid on</text><circle cx="295" cy="561" r="2.5" fill="#d29922"/><text x="308" y="565" class="row">collectAsState is quietly leaking your work</text><circle cx="295" cy="582" r="2.5" fill="#d29922"/><text x="308" y="586" class="row">Your LazyColumn recomposes on every scroll</text><circle cx="295" cy="603" r="2.5" fill="#d29922"/><text x="308" y="607" class="row">CancellationException is not an assassin</text><circle cx="295" cy="638" r="2.5" fill="#58a6ff"/><text x="308" y="642" class="row">The captain routes. The captain never rows.</text><circle cx="295" cy="673" r="2.5" fill="#f778ba"/><text x="308" y="677" class="row">Plausible is worse than wrong</text><text x="22" y="708" class="foot">Generated 2026-11-12 from the-loopdown registry.json, itself derived from the lesson files.</text></svg>