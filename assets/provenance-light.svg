fill="#a371f7">Mileway</text><text x="210" y="102" class="cnt" fill="#a371f7">10</text><text x="36" y="117" class="src">github.com/darkpandawarrior/Mileway</text><rect x="28" y="314" width="190" height="13" rx="3" fill="#3fb950" fill-opacity=".14"/><text x="36" y="324" class="pj" fill="#3fb950">Dice</text><text x="210" y="324" class="cnt" fill="#3fb950">4</text><text x="36" y="339" class="src">production, private</text><rect x="28" y="410" width="190" height="13" rx="3" fill="#d29922" fill-opacity=".14"/><text x="36" y="420" class="pj" fill="#d29922">AgentHarness</text><text x="210" y="420" class="cnt" fill="#d29922">1</text><text x="36" y="435" class="src">private</text><rect x="28" y="443" width="190" height="13" rx="3" fill="#58a6ff" fill-opacity=".14"/><text x="36" y="453" class="pj" fill="#58a6ff">The Loopdown</text><text x="210" y="453" class="cnt" fill="#58a6ff">1</text><text x="36" y="468" class="src">github.com/darkpandawarrior/the-loopdown</text><rect x="28" y="476" width="190" height="13" rx="3" fill="#f778ba" fill-opacity=".14"/><text x="36" y="486" class="pj" fill="#f778ba">PaymentsLab</text><text x="210" y="486" class="cnt" fill="#f778ba">1</text><text x="36" y="501" class="src">github.com/darkpandawarrior/PaymentsLab</text><circle cx="310" cy="98" r="2.5" fill="#a371f7"/><text x="322" y="102" class="ls">I audited my own migrations. It was not fine.</text><circle cx="310" cy="119" r="2.5" fill="#a371f7"/><text x="322" y="123" class="ls">Your thresholds do not belong in constants</text><circle cx="310" cy="140" r="2.5" fill="#a371f7"/><text x="322" y="144" class="ls">Invariants are cheap. Silent corruption is not.</text><circle cx="310" cy="161" r="2.5" fill="#a371f7"/><text x="322" y="165" class="ls">Every filter needs a documented exception</text><circle cx="310" cy="182" r="2.5" fill="#a371f7"/><text x="322" y="186" class="ls">When two sensors disagree, rank them</text><circle cx="310" cy="203" r="2.5" fill="#a371f7"/><text x="322" y="207" class="ls">Your data model is where uncertainty goes to die</text><circle cx="310" cy="224" r="2.5" fill="#a371f7"/><text x="322" y="228" class="ls">One global threshold is how you delete valid data</text><circle cx="310" cy="245" r="2.5" fill="#a371f7"/><text x="322" y="249" class="ls">Filtered should never mean deleted</text><circle cx="310" cy="266" r="2.5" fill="#a371f7"/><text x="322" y="270" class="ls">The 5-second window that crashes your service</text><circle cx="310" cy="287" r="2.5" fill="#a371f7"/><text x="322" y="291" class="ls">Teaching a phone to disbelieve its own GPS</text><circle cx="310" cy="320" r="2.5" fill="#3fb950"/><text x="322" y="324" class="ls">Never silently change a number someone gets paid on</text><circle cx="310" cy="341" r="2.5" fill="#3fb950"/><text x="322" y="345" class="ls">collectAsState is quietly leaking your work</text><circle cx="310" cy="362" r="2.5" fill="#3fb950"/><text x="322" y="366" class="ls">Your LazyColumn recomposes on every scroll</text><circle cx="310" cy="383" r="2.5" fill="#3fb950"/><text x="322" y="387" class="ls">CancellationException is not an assassin</text><circle cx="310" cy="416" r="2.5" fill="#d29922"/><text x="322" y="420" class="ls">The captain routes. The captain never rows.</text><circle cx="310" cy="449" r="2.5" fill="#58a6ff"/><text x="322" y="453" class="ls">Plausible is worse than wrong</text><circle cx="310" cy="482" r="2.5" fill="#f778ba"/><text x="322" y="486" class="ls">expect/actual is the wrong default in KMP</text>
<text x="22" y="531" class="f">Generated 2026-08-28 from the-loopdown registry.json, itself derived from the lesson files.</text>
