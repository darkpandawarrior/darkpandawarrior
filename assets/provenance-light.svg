<text x="22" y="30" class="t">Every lesson, and the system it came out of</text>
<text x="22" y="48" class="sub">17 written pieces, traced back to the code that produced them. Ten out of one project is not a blog, it is a project worth writing down.</text>
<text x="22" y="64" class="sub">Left is the system. Right is what it taught. The edges are the claim.</text>
