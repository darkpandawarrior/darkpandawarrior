    100%{transform:translateX(22px);opacity:0}}
</style>
<rect width="1000" height="330" rx="10" fill="url(#hg)"/>
<text x="30" y="52" class="nm">Siddharth Pandalai</text>
<text x="30" y="76" class="rl">SENIOR ANDROID ENGINEER</text>
<text x="30" y="100" class="sb">I own an Android platform at scale, and I keep the reusable half of it. Kotlin, Compose, Kotlin Multiplatform.</text>
<line x1="30" y1="114" x2="970" y2="114" stroke="#d1d9e0"/>
<line x1="242" y1="191" x2="264" y2="191" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="242" cy="191" r="2.6" fill="#7F52FF" class="flow" style="animation-delay:0s"/><line x1="480" y1="191" x2="502" y2="191" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="480" cy="191" r="2.6" fill="#7F52FF" class="flow" style="animation-delay:0.45s"/><line x1="718" y1="191" x2="740" y2="191" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="718" cy="191" r="2.6" fill="#7F52FF" class="flow" style="animation-delay:0.9s"/><rect x="30" y="132" width="208" height="118" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="30" y="132" width="208" height="3" rx="1.5" fill="#7F52FF" opacity="0.35"/><text x="44" y="154" class="hk">PRODUCTION</text><text x="44" y="172" class="ht">Dice.tech</text><text x="44" y="188" class="hl">964k LOC, 772k Kotlin</text><text x="44" y="204" class="hl">50k+ monthly actives</text><text x="44" y="220" class="hl">~87% of the UI on Compose</text><rect x="268" y="132" width="208" height="118" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="268" y="132" width="208" height="3" rx="1.5" fill="#7F52FF" opacity="0.57"/><text x="282" y="154" class="hk">EXTRACTED</text><text x="282" y="172" class="ht">kmp-toolkit</text><text x="282" y="188" class="hl">39 modules</text><text x="282" y="204" class="hl">22 convention plugins</text><text x="282" y="220" class="hl">extracted on second use</text><rect x="506" y="132" width="208" height="118" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="506" y="132" width="208" height="3" rx="1.5" fill="#7F52FF" opacity="0.79"/><text x="520" y="154" class="hk">REUSED</text><text x="520" y="172" class="ht">four apps</text><text x="520" y="188" class="hl">Mileway, PaymentsLab</text><text x="520" y="204" class="hl">Kursi, app-template</text><text x="520" y="220" class="hl">Android, iOS, Desktop, Web</text><rect x="744" y="132" width="208" height="118" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="744" y="132" width="208" height="3" rx="1.5" fill="#7F52FF" opacity="1.01"/><text x="758" y="154" class="hk">PUBLISHED</text><text x="758" y="172" class="ht">in the open</text><text x="758" y="188" class="hl">173 client apps shipped</text><text x="758" y="204" class="hl">89 still live today</text><text x="758" y="220" class="hl">17 lessons written up</text><text x="30" y="279" class="hk">ONE SHARED CORE REACHES</text><rect x="198" y="266" width="66.80000000000001" height="19" rx="9.5" fill="#7F52FF" fill-opacity=".12" stroke="#7F52FF" stroke-opacity=".3"/><text x="231.4" y="279" class="pl" text-anchor="middle">Android</text><rect x="273.8" y="266" width="41.2" height="19" rx="9.5" fill="#7F52FF" fill-opacity=".12" stroke="#7F52FF" stroke-opacity=".3"/><text x="294.40000000000003" y="279" class="pl" text-anchor="middle">iOS</text><rect x="324" y="266" width="66.80000000000001" height="19" rx="9.5" fill="#7F52FF" fill-opacity=".12" stroke="#7F52FF" stroke-opacity=".3"/><text x="357.4" y="279" class="pl" text-anchor="middle">Wear OS</text><rect x="399.8" y="266" width="66.80000000000001" height="19" rx="9.5" fill="#7F52FF" fill-opacity=".12" stroke="#7F52FF" stroke-opacity=".3"/><text x="433.20000000000005" y="279" class="pl" text-anchor="middle">Desktop</text><rect x="475.6" y="266" width="86" height="19" rx="9.5" fill="#7F52FF" fill-opacity=".12" stroke="#7F52FF" stroke-opacity=".3"/><text x="518.6" y="279" class="pl" text-anchor="middle">Web (Wasm)</text>
<text x="30" y="316" class="ft">Every count above is fetched from the repository that owns it, on the same schedule as the rest of this page. Generated 2026-08-30.</text>
