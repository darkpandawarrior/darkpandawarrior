<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Siddharth Pandalai, Senior Android Engineer. Production work at Dice.tech, the Kotlin Multiplatform core extracted from it, the four apps that core carries, and what was published in the open.">
<defs>
  <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f6f8fa"/>
  </linearGradient>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .nm{font-size:38px;font-weight:700;fill:#1f2328;letter-spacing:-.5px}
  .rl{font-size:13px;fill:#7F52FF;letter-spacing:.18em}
  .sb{font-size:11.5px;fill:#59636e}
  .hk{font-size:8.5px;fill:#59636e;letter-spacing:.16em}
  .ht{font-size:14px;font-weight:700;fill:#1f2328}
  .hl{font-size:10.5px;fill:#59636e}
  .pl{font-size:10px;fill:#7F52FF}
  .ft{font-size:9px;fill:#818b98}
